  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

        e.target.tagName, String(e.target.src || e.target.href || ''));

    const templateEl = document.querySelector('script[type="__bundler/template"]');

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';
    function trustedOrigin(e) {

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);

            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        }

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

font-weight: 400;\n  font-display: swap;\n  src: url(\"0ce1d899-4772-4c01-b971-c70ce7ebca98\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"f7a8ac05-d975-494c-9472-18576589e59b\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"8ee9f153-6a19-40eb-ae76-886c7a3fcb96\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"90e813f2-3ad9-4a96-bd77-77f9cfc3affc\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"4b9e5226-9d8c-421d-aeb3-c125ddfd497f\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"608a55c0-e908-409f-ae9c-8cac5bdb8e9c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f2f2f3;\n  --color-surface: #e9e9ea;\n  --color-text: #1d1f20;\n  --color-accent: #5980a6;\n  --color-accent-2: #728fab;\n  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f5f5f8;\n  --color-neutral-200: #e7e7ea;\n  --color-neutral-300: #d4d4d7;\n  --color-neutral-400: #b7b7ba;\n  --color-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1px solid var(--color-divider); }\n.btn-primary { border-color: var(--color-accent); }\n.btn-ghost { border-color: transparent; }\n\n<\u002Fstyle>\n  <script src=\"d745d6aa-9c08-4fdf-89d2-a84d378ce51e\"><\u002Fscript>\n  <script src=\"398e614c-0f26-4187-a046-149077fb7a7f\"><\u002Fscript>\n  <script src=\"8c742562-f72e-45ae-9652-1e068f6ee635\"><\u002Fscript>\n  <style>\n    body{margin:0}\n    html{scroll-behavior:smooth}\n    a{color:var(--color-accent-700)}\n    a:hover{color:var(--color-accent-900)}\n    [data-lucide]{width:22px;height:22px;stroke-width:1.5}\n    .ti-plate{border:1px solid var(--color-divider);position:relative;padding:32px}\n    .ti-num{position:absolute;top:-18px;right:0;font-family:var(--font-heading);font-size:150px;line-height:1;color:var(--color-accent-100);z-index:0;pointer-events:none;user-select:none}\n    .ti-tag-row{font-family:var(--font-heading);font-size:13px;letter-spacing:0.1em;color:var(--color-accent-700);margin-bottom:10px;position:relative;z-index:1}\n    .ti-cells{display:grid;border:1px solid var(--color-divider);position:relative;z-index:1}\n    .ti-cells > div{padding:26px;border-right:1px solid var(--color-divider)}\n    .ti-cells > div:last-child{border-right:none}\n    @media (max-width:900px){\n      .ti-layout{display:block !important}\n      .ti-cells{grid-template-columns:1fr !important}\n      .ti-cells > div{border-right:none !important;border-bottom:1px solid var(--color-divider)}\n      .ti-cells > div:last-child{border-bottom:none}\n      .ti-2col{grid-template-columns:1fr !important}\n      .ti-num{font-size:80px}\n    }\n    .nav a[aria-current=\"page\"]{border-bottom-color:var(--color-accent);color:var(--color-accent-800)}\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)\">\n\n  <nav class=\"nav\" style=\"border-bottom:1px solid var(--color-divider);position:sticky;top:0;background:var(--color-bg);z-index:20;padding:14px 24px;ga de=\"clipboard-list\" style=\"color:var(--color-accent)\"><\u002Fi><h4 class=\"card-title\" style=\"margin-top:12px\">Proyecto<\u002Fh4><p class=\"card-body\">Qué se hará, para quién y en qué fases.<\u002Fp><\u002Fdiv>\n          <div style=\"cursor:pointer\" sc-camel-on-click=\"{{ goEquipo }}\"><i data-lucide=\"users\" style=\"color:var(--color-accent)\"><\u002Fi><h4 class=\"card-title\" style=\"margin-top:12px\">Equipo<\u002Fh4><p class=\"card-body\">4 integrantes y sus roles técnicos.<\u002Fp><\u002Fdiv>\n          <div style=\"cursor:pointer\" sc-camel-on-click=\"{{ goIdentidad }}\"><i data-lucide=\"badge-check\" style=\"color:var(--color-accent)\"><\u002Fi><h4 class=\"card-title\" style=\"margin-top:12px\">Identidad<\u002Fh4><p class=\"card-body\">Misión, visión y valores corporativos.<\u002Fp><\u002Fdiv>\n          <div style=\"cursor:pointer\" sc-camel-on-click=\"{{ goDofa }}\"><i data-lucide=\"compass\" style=\"color:var(--color-accent)\"><\u002Fi><h4 class=\"card-title\" style=\"margin-top:12px\">DOFA<\u002Fh4><p class=\"card-body\">Debilidades, oportunidades, fortalezas y amenazas.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isProyecto }}\" hint-placeholder-val=\"{{ false }}\">\n      <section id=\"proyecto\" style=\"padding:72px 0 48px;position:relative;overflow:hidden\">\n        <div class=\"ti-tag-row\">01 / 05 — EL PROYECTO<\u002Fdiv>\n        <div class=\"ti-num\">01<\u002Fdiv>\n        <h2 style=\"position:relative;z-index:1;margin-bottom:20px\">Descripción del proyecto<\u002Fh2>\n        <p style=\"max-width:760px;line-height:1.7;position:relative;z-index:1\">Se desarrollará un sistema integral de gestión y mantenimiento técnico para la infraestructura informática de la organización, solucionando la falta de control técnico, la ausencia de hojas de vida digitales y de registros históricos de los equipos, evitando paros operativos y reduciendo costos por reparaciones de emergencia.<\u002Fp>\n\n        <div class=\"ti-cells\" style=\"grid-template-columns:repeat(4,1fr);margin:32px 0\">\n          <div><i data-lucide=\"wrench\" style=\"color:var(--color-accent)\"><\u002Fi><h4 class=\"card-title\" style=\"margin-top:12px\">Mantenimiento físico<\u002Fh4><p class=\"card-body\">Limpieza preventiva interna, verificación de componentes y ensamblaje.<\u002Fp><\u002Fdiv>\n          <div><i data-lucide=\"monitor-cog\" style=\"color:var(--color-accent)\"><\u002Fi><h4 class=\"card-title\" style=\"margin-top:12px\">Mantenimiento lógico<\u002Fh4><p class=\"card-body\">Depuración, optimización de rendimiento, actualización y formateo limpio.<\u002Fp><\u002Fdiv>\n          <div><i data-lucide=\"clipboard-list\" style=\"color:var(--color-accent)\"><\u002Fi><h4 class=\"card-title\" style=\"margin-top:12px\">Hojas de vida digitales<\u002Fh4><p class=\"card-body\">Perfiles individuales por equipo con historial de intervenciones.<\u002Fp><\u002Fdiv>\n          <div><i data-lucide=\"boxes\" style=\"color:var(--color-accent)\"><\u002Fi><h4 class=\"card-title\" style=\"margin-top:12px\">Gestión de inventario<\u002Fh4><p class=\"card-body\">Control y diagnóstico del estado de la plataforma informática.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"ti-2col\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-bottom:48px\">\n          <div><h6 style=\"color:var(--color-accent);margin-bottom:10px\">Dirigido a<\u002Fh6><p style=\"line-height:1.7\">PyMEs, organizaciones o instituciones que dependen de equipos informáticos para su operación diaria y requieren reducir tiempos de inactividad.<\u002Fp><\u002Fdiv>\n          <div><h6 style=\"color:var(--color-accent);margin-bottom:10px\">Ejecución por fases<\u002Fh6><p style=\"line-height:1.7\">Diagnóstico → Registro e inventario → Intervención y mantenimiento → Control y seguimiento periódico.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"ti-plate elev-sm\" style=\"background:var(--color-surface);margin-bottom:24px\">\n          <span class=\"card-kicker\">Objetivo general<\u002Fspan>\n          <p style=\"font-size:16px;line-height:1.7;margin:8px 0 0;position:relative;z-index:1\">Diseñar un plan de mantenimiento preventivo, correctivo y de documentación técnica para el parque tecnológico de computadores de TechSoporte Integral, garantizando su óptimo rendimiento, conectividad y la extensión de su vida útil.<\u002Fp>\n        <\u002Fdiv>\n\n        <span class=\"card-kicker\" style=\"display:block;margin-bottom:14px\">Objetivos específicos<\u002Fspan>\n        <div class=\"ti-cells\" style=\"grid-template-columns:repeat(3,1fr)\">\n          <div><i data-lucide=\"search\" style=\"color:var(--color-accent)\"><\u002Fi><p style=\"margin-top:12px\">Diagnóstico técnico inicial del estado físico y lógico para identificar fallas críticas y mitigar riesgos de pérdida de información.<\u002Fp><\u002Fdiv>\n          <div><i data-lucide=\"layers\" style=\"color:var(--color-accent)\"><\u002Fi><p style=\"margin-top:12px\">Inventario sistematizado y hojas de vida digitalizadas para controlar hardware y legalidad del software.<\u002Fp><\u002Fdiv>\n          <div><i data-lucide=\"shield-check\" style=\"color:var(--color-accent)\"><\u002Fi><p style=\"margin-top:12px\">Jornadas de mantenimiento preventivo, correctivo y optimización lógica, extendiendo la vida útil de los componentes.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isEquipo }}\" hint-placeholder-val=\"{{ false }}\">\n      <section id=\"equipo\" style=\"padding:72px 32px 48px;margin:0 -32px;background:var(--color-surface);position:relative;overflow:hidden\">\n        <div class=\"ti-tag-row\">02 / 05 — QUIÉNES SOMOS<\u002Fdiv>\n        <div class=\"ti-num\">02<\u002Fdiv>\n        <h2 style=\"position:relative;z-index:1;margin-bottom:12px\">Equipo del proyecto<\u002Fh2>\n        <p style=\"max-width:700px;line-height:1.7;margin-bottom:28px;position:relative;z-index:1\">Aprendices del programa Técnico en Sistemas Teleinformáticos, Colegio Militar JQA — proyecto articulado con SENATIC, SENA.<\u002Fp>\n        <div style=\"position:relative;z-index:1;border:1px solid var(--color-divider);background:var(--color-bg)\">\n          <div style=\"display:grid;grid-template-columns:1.4fr 1.1fr 1.6fr 1fr;padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--color-divider)\">\n            <span style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-text);opacity:0.6\">Integrante<\u002Fspan>\n            <span style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-text);opacity:0.6\">Rol<\u002Fspan>\n            <span style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-text);opacity:0.6\">Correo<\u002Fspan>\n            <span style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-text);opacity:0.6\">Teléfono<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ team }}\" as=\"member\" hint-placeholder-count=\"4\">\n            <div style=\"display:grid;grid-template-columns:1.4fr 1.1fr 1.6fr 1fr;padding:var(--space-3);border-bottom:1px solid var(--color-divider);align-items:center;font-size:14px\">\n              <span style=\"font-family:var(--font-heading)\">{{ member.name }}<\u002Fspan>\n              <span class=\"tag tag-accent\" style=\"width:fit-content\">{{ member.role }}<\u002Fspan>\n              <span>{{ member.email }}<\u002Fspan>\n              <span>{{ member.phone }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isIdentidad }}\" hint-placeholder-val=\"{{ false }}\">\n      <section id=\"identidad\" style=\"padding:72px 0 48px;position:relative;overflow:hidden\">\n        <div class=\"ti-tag-row\">03 / 05 — IDENTIDAD CORPORATIVA<\u002Fdiv>\n        <div class=\"ti-num\">03<\u002Fdiv>\n        <h2 style=\"position:relative;z-index:1;margin-bottom:32px\">Nuestra empresa<\u002Fh2>\n        <div class=\"ti-2col\" style=\"display:grid;grid-template-columns:0.9fr 1.1fr;gap:40px;margin-bottom:48px;align-items:center;position:relative;z-index:1\">\n          <div class=\"blueprint\" style=\"padding:18px;background:var(--color-surface);justify-self:center\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <img src=\"8e4211f7-de3a-4d18-ac1f-1e177988ae0f\" alt=\"Logo\" style=\"width:180px;height:180px;object-fit:cover;display:block\">\n          <\u002Fdiv>\n          <div>\n            <span class=\"tag tag-accent\" style=\"padding:6px 14px\">Slogan<\u002Fspan>\n            <p style=\"font-size:24px;font-family:var(--font-heading);margin:14px 0 12px\">\"Conectando tu mundo con excelencia técnica.\"<\u002Fp>\n            <p style=\"line-height:1.7;max-width:420px\">Un equipo técnico especializado que respalda cada intervención con diagnóstico, documentación y seguimiento — de principio a fin.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ti-2col\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-bottom:48px;position:relative;z-index:1\">\n          <div><h6 style=\"color:var(--color-accent);margin-bottom:10px\">Misión<\u002Fh6><p style=\"line-height:1.7\">TechSoporte Integral S.A.S. ofrece mantenimiento preventivo y correctivo de hardware, instalación y configuración de software, y optimización de redes locales, garantizando continuidad operativa, rendimiento óptimo y seguridad digital.<\u002Fp><\u002Fdiv>\n          <div><h6 style=\"color:var(--color-accent);margin-bottom:10px\">Visión<\u002Fh6><p style=\"line-height:1.7\">Ser reconocidos como aliados técnicos confiables, con soluciones eficientes y adaptadas a las necesidades tecnológicas actuales de nuestros clientes.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <h6 style=\"color:var(--color-accent);margin-bottom:16px;position:relative;z-index:1\">Valores corporativos<\u002Fh6>\n        <div class=\"ti-cells\" style=\"grid-template-columns:repeat(4,1fr)\">\n          <div><i data-lucide=\"target\" style=\"color:var(--color-accent)\"><\u002Fi><h4 class=\"card-title\" style=\"margin-top:12px\">Compromiso técnico<\u002Fh4><p class=\"card-body\">Precisión en cada diagnóstico, reparación y configuración.<\u002Fp><\u002Fdiv>\n          <div><i data-lucide=\"shield-check\" style=\"color:var(--color-accent)\"><\u002Fi><h4 class=\"card-title\" style=\"margin-top:12px\">Confiabilidad<\u002Fh4><p class=\"card-body\">Seguridad y confidencialidad de los datos de los clientes.<\u002Fp><\u002Fdiv>\n          <div><i data-lucide=\"zap\" style=\"color:var(--color-accent)\"><\u002Fi><h4 class=\"card-title\" style=\"margin-top:12px\">Eficiencia<\u002Fh4><p class=\"card-body\">Tiempos de respuesta óptimos sin sacrificar excelencia técnica.<\u002Fp><\u002Fdiv>\n          <div><i data-lucide=\"scale\" style=\"color:var(--color-accent)\"><\u002Fi><h4 class=\"card-title\" style=\"margin-top:12px\">Responsabilidad<\u002Fh4><p class=\"card-body\">Manejo ético en la disposición de residuos tecnológicos.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isDofa }}\" hint-placeholder-val=\"{{ false }}\">\n      <section id=\"dofa\" style=\"padding:72px 32px 48px;margin:0 -32px;background:var(--color-surface);position:relative;overflow:hidden\">\n        <div class=\"ti-tag-row\">04 / 05 — CONTEXTO DE LA ORGANIZACIÓN<\u002Fdiv>\n        <div class=\"ti-num\">04<\u002Fdiv>\n        <h2 style=\"position:relative;z-index:1;margin-bottom:28px\">Análisis D.O.F.A.<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--color-divider);background:var(--color-bg);position:relative;z-index:1\" class=\"ti-2col\">\n          <sc-for list=\"{{ dofa }}\" as=\"quad\" hint-placeholder-count=\"4\">\n            <div style=\"padding:28px;border-right:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider)\">\n              <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px\">\n                <i data-lucide=\"{{ quad.icon }}\" style=\"color:var(--color-accent)\"><\u002Fi>\n                <h4 class=\"card-title\">{{ quad.title }}<\u002Fh4>\n              <\u002Fdiv>\n              <ul style=\"margin:0;padding-left:18px;font-size:13.5px;opacity:0.85;line-height:1.6\">\n                <sc-for list=\"{{ quad.items }}\" as=\"it\" hint-placeholder-count=\"4\">\n                  <li style=\"margin-bottom:10px\">{{ it }}<\u002Fli>\n                <\u002Fsc-for>\n              <\u002Ful>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"margin:64px -32px 0;background:var(--color-accent-900);color:var(--color-neutral-100);padding:56px 32px;text-align:center\">\n        <h2 style=\"color:var(--color-neutral-100);margin-bottom:16px\">¿Listo para optimizar tu infraestructura tecnológica?<\u002Fh2>\n        <a href=\"#\" class=\"btn\" style=\"background:var(--color-neutral-100);color:var(--color-accent-900);border-color:var(--color-neutral-100);display:inline-flex\" sc-camel-on-click=\"{{ goContacto }}\">Hablemos<\u002Fa>\n      <\u002Fsection>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isContacto }}\" hint-placeholder-val=\"{{ false }}\">\n      <section id=\"contacto\" style=\"padding:56px 32px 64px;margin:0 -32px;background:var(--color-surface);position:relative;overflow:hidden\">\n        <div class=\"ti-tag-row\">05 / 05 — HABLEMOS<\u002Fdiv>\n        <div class=\"ti-num\">05<\u002Fdiv>\n        <h2 style=\"position:relative;z-index:1;margin-bottom:28px\">Contacto<\u002Fh2>\n        <div class=\"ti-2col\" style=\"display:grid;grid-template-colu er style=\"border-top:1px solid var(--color-divider);padding:28px 0;text-align:center\">\n        <p class=\"text-muted\" style=\"margin:0;font-size:12px\">TechSoporte Integral S.A.S. — Proyecto productivo SENATIC, articulación con la educación media — 2026<\u002Fp>\n      <\u002Ffooter>\n    <\u002Fmain>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { section: 'inicio' };\n  goTo(section) { this.setState({ section }); window.scrollTo(0, 0); }\n\n  team = [\n    { name: 'Juan Sebastián Querubín Ariza', role: 'Líder de proyecto', email: 'jcquerubin1@gmail.com', phone: '310 404 7054' },\n    { name: 'Diego Andrés Saavedra Mora', role: 'Especialista en Hardware', email: 'saavedradiego546@gmail.com', phone: '322 473 6041' },\n    { name: 'Karen Dayana Gómez Borda', role: 'Especialista en Software y Redes', email: 'karendayanagomezb23@gmail.com', phone: '319 294 6594' },\n    { name: 'Yolimar Cadena Meza', role: 'Documentación y Calidad', email: 'yolicadenameza6@gmail.com', phone: '322 772 5452' },\n  ];\n\n  dofa = [\n    { title: 'Debilidades', icon: 'trending-down', items: [\n      'Capacidad operativa limitada: un equipo de 4 personas puede saturarse ante solicitudes simultáneas.',\n      'Presupuesto inicial ajustado para herramientas de diagnóstico avanzadas o stock de repuestos.',\n      'Dependencia de roles clave: la ausencia de un especialista frena su área operativa.',\n      'Marca en fase de posicionamiento, sin historial extenso de clientes.',\n    ]},\n    { title: 'Oportunidades', icon: 'trending-up', items: [\n      'Alta demanda local de mantenimiento de equipos y redes domésticas o comerciales.',\n      'Mercado de actualización tecnológica frente a la compra de equipos nuevos.',\n      'Alianzas estratégicas con proveedores de repuestos a precios competitivos.',\n      'Nicho en pequeñas empresas, colegios y locales del sector con contratos periódicos.',\n    ]},\n    { title: 'Fortalezas', icon: 'shield-check', items: [\n      'Roles técnicos bien definidos en hardware y software/redes.',\n      'Estructura organizacional óptima: comunicación rápida y decisiones ágiles.',\n      'Enfoque integral: mantenimiento físico, lógico y de conectividad en un solo lugar.',\n      'Conocimientos técnicos actualizados en sistemas teleinformáticos.',\n    ]},\n    { title: 'Amenazas', icon: 'alert-triangle', items: [\n      'Alta competencia de técnicos independientes y talleres ya posicionados.',\n      'Fluctuación de precios en repuestos importados (pantallas, discos, RAM).',\n      'Rápida obsolescencia tecnológica que exige actualización constante.',\n      'Ofertas agresivas de equipos nuevos a bajo costo.',\n    ]},\n  ];\n\n  refreshChrome() {\n    const attempt = () => {\n      if (window.lucide && window.lucide.createIcons) window.lucide.createIcons();\n      else { setTimeout(attempt, 200); return; }\n    };\n    attempt();\n    const drawQr = () => {\n      const el = document.getElementById('qr-canvas');\n      if (!el) return;\n      // QR estatico\n    };\n    drawQr();\n  }\n\n  componentDidMount() { this.refreshChrome(); }\n  componentDidUpdate() { this.refreshChrome(); }\n\n  renderVals() {\n    const s = this.state.section;\n    const aria = (name) => (s === name ? 'page' : undefined);\n    return {\n      team: this.team, dofa: this.dofa,\n      isInicio: s === 'inicio', isProyecto: s === 'proyecto', isEquipo: s === 'equipo',\n      isIdentidad: s === 'identidad', isDofa: s === 'dofa', isContacto: s === 'contacto',\n      inicioAria: aria('inicio'), proyectoAria: aria('proyecto'), equipoAria: aria('equipo'),\n      identidadAria: aria('identidad'), dofaAria: aria('dofa'), contactoAria: aria('contacto'),\n      goInicio: () => this.goTo('inicio'), goProyecto: () => this.goTo('proyecto'),\n      goEquipo: () => this.goTo('equipo'), goIdentidad: () => this.goTo('identidad'),\n      goDofa: () => this.goTo('dofa'), goContacto: () => this.goTo('contacto'),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
